docs_dir: build/docs-staging
site_name: DIAG 实验 wiki
theme:
  name: material
  features: [navigation.tabs, navigation.sections, toc.follow, search.suggest]
  palette: [{scheme: default, primary: indigo, accent: indigo}]
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - pymdownx.arithmatex: {generic: true}
nav:
   - 总览: index.md
   - 锚线: line_anchor.md
   - 估计器线: line_estimator.md
   - 读出线: line_readout.md
   - Baseline v1.0: baseline.md
   - 舱内外对照: compare_table.md
   - 流程纪律: discipline.md
   - 有效Runs: runs.md
   - 实验地图: map.md
   - 推导: [建模总表: modeling.md, 实现明细: implementation.md, 模块速览: design.md]
   - 历史归档: [主旨P1-P10: mission.md, H2/H4动力学: node1_dynamics.md, H3/边界读出: node2_boundary.md, 监督与纪律: node3_opt.md, 旧进展看板: framework.md, 论文数字参照: repro_map.md, 旧管线: pipeline.md]
